services:
  postgres:
    image: postgres:16
    container_name: idop-postgres
    environment:
      POSTGRES_USER: idop
      POSTGRES_PASSWORD: idop_password
      POSTGRES_DB: idop
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idop -d idop"]
      interval: 5s
      timeout: 5s
      retries: 20
